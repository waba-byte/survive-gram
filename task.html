<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missioni — Survive Gram</title>
<meta name="theme-color" content="#070310">
<link rel="icon" type="image/svg+xml" href="durov-cartoon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="lb.js?v=5"></script>
<script src="i18n.js?v=5"></script>
<script src="tasks.js?v=1"></script>
<style>
  :root{
    --bg:#070310; --panel:#0c0816;
    --red:#b026ff; --red-dim:#2c0a40; --red-glow:#d178ff;
    --green:#2aabee; --green-dim:#1c7fb8; --txt:#cfcfcf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 0%, #0c0518 0%, var(--bg) 70%);
    color:var(--txt);font-family:"Courier New",ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100%;padding:18px 14px;
    user-select:none;-webkit-user-select:none;overflow-x:hidden;
  }
  .brand{color:var(--green);letter-spacing:clamp(2px,1.4vw,5px);font-size:clamp(15px,4.5vw,20px);
    font-weight:700;text-shadow:0 0 8px var(--green-dim);margin-bottom:4px}
  h1{color:var(--green);letter-spacing:3px;font-size:22px;text-shadow:0 0 8px var(--green-dim);margin-bottom:16px}
  .panel{width:min(460px,94vw);background:var(--panel);border:1px solid #1c1030;border-radius:10px;
    padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 30px rgba(176,38,255,.08) inset}
  /* riepilogo punti GRAM */
  .gram-row{display:flex;align-items:baseline;justify-content:center;gap:10px}
  .gram-row .lbl{font-size:11px;letter-spacing:2px;color:#8a7a9a;text-transform:uppercase}
  .gram-row .gram{font-size:30px;font-weight:700;color:var(--green);text-shadow:0 0 10px var(--green-dim);font-variant-numeric:tabular-nums}
  .tcount{font-size:11px;color:#6a5a7a;text-align:center;letter-spacing:1px}
  .hint{font-size:11px;color:#6a5a7a;text-align:center;letter-spacing:1px;margin-bottom:2px}
  /* lista missioni */
  ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin:0;padding:0}
  .task{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:8px;background:#0a0712;border:1px solid #15102a}
  .task.ready{border-color:var(--green-dim);box-shadow:0 0 10px rgba(42,171,238,.18)}
  .task.done{opacity:.5}
  .task .ic{font-size:22px;flex:none;width:26px;text-align:center}
  .task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .task .t{color:var(--green);font-size:14px;font-weight:700;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .d{color:#9a8aaa;font-size:11px;line-height:1.3}
  .task .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}
  .task .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--red-glow));transition:width .3s}
  .task .pg{font-size:10px;color:#8a7a9a;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .task .act{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:62px}
  .task .rw{font-size:12px;font-weight:700;color:#d8c24a;letter-spacing:.5px;white-space:nowrap}
  .task.done .rw{color:#6a5a7a}
  .task .act button{font-family:inherit;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;
    border-radius:6px;padding:7px 12px;font-size:12px;white-space:nowrap}
  .task .act button:active{transform:scale(.95)}
  .task .act button:disabled{cursor:default}
  .b-claim{background:var(--green);color:#042033;box-shadow:0 0 10px var(--green-dim);animation:cpulse 1.2s ease-in-out infinite}
  @keyframes cpulse{0%,100%{box-shadow:0 0 8px var(--green-dim)}50%{box-shadow:0 0 16px var(--green)}}
  .b-go{background:var(--red);color:#fff;box-shadow:0 0 10px var(--red)}
  .b-done{background:#15102a;color:#6a5a7a}
  #playBtn{margin-top:18px;font-family:inherit;font-weight:700;letter-spacing:2px;cursor:pointer;border:none;
    border-radius:7px;padding:14px 30px;font-size:16px;background:var(--green);color:#042033;box-shadow:0 0 14px var(--green-dim)}
  #playBtn:active{transform:scale(.96)}
  #crt{position:fixed;inset:0;pointer-events:none;z-index:100;
    background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5) 100%);
    background-size:100% 3px,100% 100%}
</style>
</head>
<body>
  <div id="crt"></div>
  <div class="brand">SURVIVE GRAM</div>
  <h1 data-i18n="tsk_title">🎯 MISSIONI</h1>
  <div class="panel">
    <div class="gram-row"><span class="lbl" data-i18n="tsk_points">Punti GRAM</span><span class="gram" id="gram">0</span></div>
    <div class="tcount">✓ <span id="tcount">0 / 0</span></div>
    <div class="hint" data-i18n="tsk_hint">Completa le missioni e accumula punti GRAM.</div>
    <ul id="tlist"></ul>
  </div>
  <button id="playBtn" data-i18n="btn_play">▶ GIOCA</button>

<script>
(function(){
  "use strict";
  const TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
  function tgv(v){ try{ return !!(TG&&TG.isVersionAtLeast&&TG.isVersionAtLeast(v)); }catch(e){ return false; } }
  function haptic(ok){ try{ if(TG&&TG.HapticFeedback&&tgv("6.1")) TG.HapticFeedback.notificationOccurred(ok?"success":"warning"); }catch(e){} }
  const tlist=document.getElementById("tlist");
  const gramEl=document.getElementById("gram"), tcountEl=document.getElementById("tcount");
  const playBtn=document.getElementById("playBtn");

  function go(){ location.href="index.html"; }
  const fmt=m=>m>=10?m.toFixed(1):m.toFixed(2);

  function render(){
    const tasks=TASKS.list();
    gramEl.textContent=TASKS.gram();
    const done=tasks.filter(t=>TASKS.isClaimed(t.id)).length;
    tcountEl.textContent=done+" / "+tasks.length;
    tlist.innerHTML="";
    tasks.forEach(t=>{
      const claimed=TASKS.isClaimed(t.id), comp=TASKS.complete(t);
      const li=document.createElement("li");
      li.className="task"+(claimed?" done":(comp?" ready":""));

      const ic=document.createElement("span"); ic.className="ic"; ic.textContent=t.icon||"⭐";

      const body=document.createElement("div"); body.className="body";
      const tt=document.createElement("div"); tt.className="t"; tt.textContent=TASKS.text(t.title);
      const dd=document.createElement("div"); dd.className="d"; dd.textContent=TASKS.text(t.desc);
      body.append(tt,dd);
      if(t.type==="stat"){
        const p=TASKS.prog(t);
        const bar=document.createElement("div"); bar.className="bar";
        const fill=document.createElement("i");
        fill.style.width=Math.max(0,Math.min(100,(p.raw/p.goal)*100)).toFixed(0)+"%";
        bar.appendChild(fill);
        const pg=document.createElement("div"); pg.className="pg";
        const cur=(t.stat==="bestMult") ? (p.raw>=p.goal?fmt(p.goal):fmt(p.raw)) : Math.min(p.raw,p.goal);
        pg.textContent=cur+" / "+p.goal+(t.stat==="bestMult"?"x":"");
        body.append(bar,pg);
      }

      const act=document.createElement("div"); act.className="act";
      const rw=document.createElement("span"); rw.className="rw"; rw.textContent="+"+t.reward;
      act.appendChild(rw);
      if(claimed){
        const b=document.createElement("button"); b.className="b-done"; b.disabled=true; b.textContent=I18N.t("tsk_done");
        act.appendChild(b);
      } else if(t.type==="link" && !TASKS.isOpened(t.id)){
        const b=document.createElement("button"); b.className="b-go"; b.textContent=I18N.t("tsk_go");
        b.addEventListener("click",()=>{ TASKS.openTask(t.id); setTimeout(render,400); });
        act.appendChild(b);
      } else if(comp){
        const b=document.createElement("button"); b.className="b-claim"; b.textContent=I18N.t("tsk_claim");
        b.addEventListener("click",()=>{ if(TASKS.claim(t.id)){ haptic(true); render(); } });
        act.appendChild(b);
      }
      // missione "stat" non completata: nessun bottone, basta la barra di progresso

      li.append(ic,body,act);
      tlist.appendChild(li);
    });
  }

  if(TG){
    try{ TG.ready(); TG.expand(); }catch(e){}
    try{ if(tgv("6.1")){ TG.setHeaderColor("#070310"); TG.setBackgroundColor("#070310"); } }catch(e){}
    try{ if(tgv("6.1")&&TG.BackButton){ TG.BackButton.show(); TG.BackButton.onClick(go); } }catch(e){}
  }

  I18N.apply(document);
  TASKS.load();
  render();                  // disegno subito (cache/locale)
  TASKS.fetchDefs(render);   // poi aggiorno con le missioni dal pannello admin
  TASKS.cloudLoad(render);
  window.addEventListener("i18n:change",()=>{ I18N.apply(document); render(); });
  playBtn.addEventListener("click",go);
})();
</script>
</body>
</html>
