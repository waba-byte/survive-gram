<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Gram</title>
<meta name="theme-color" content="#070310">
<link rel="icon" type="image/svg+xml" href="durov-cartoon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="lb.js"></script>
<script src="i18n.js"></script>
<style>
  :root{
    /* tema: "viola morte" (ex rosso) + blu Telegram (ex verde) */
    --bg:#070310;
    --panel:#0c0816;
    --red:#b026ff;        /* viola morte */
    --red-dim:#2c0a40;
    --red-glow:#d178ff;
    --green:#2aabee;      /* blu Telegram */
    --green-dim:#1c7fb8;
    --txt:#cfcfcf;
    --cell-fill:#140320; --cell-hover:#2e0a40; --cell-armed:#6a1a9e;
  }
  /* ---- SKIN BLU TELEGRAM (toggle): griglia/laser/Durov in blu Telegram ---- */
  body.theme-blue{
    --bg:#03070f; --panel:#081420;
    --red:#2aabee; --red-dim:#123a57; --red-glow:#7fd3ff;   /* "pericolo": griglia/laser/Durov -> blu */
    --green:#8fe3ff; --green-dim:#2f86bd;                    /* accenti UI -> azzurro chiaro */
    --cell-fill:#04141f; --cell-hover:#0c3a55; --cell-armed:#1a6f9e;
    background:radial-gradient(circle at 50% 0%, #06121f 0%, var(--bg) 70%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 0%, #0c0518 0%, var(--bg) 70%);
    color:var(--txt);
    font-family:"Courier New",ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;padding:14px;
    user-select:none;-webkit-user-select:none;overflow-x:hidden;
  }
  header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  header .logo{width:clamp(36px,10vw,50px);aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 0 5px var(--green-dim))}
  header h1{
    color:var(--green);font-size:clamp(14px,4vw,26px);letter-spacing:clamp(1px,1vw,6px);font-weight:700;
    text-shadow:0 0 8px var(--green-dim);
  }
  /* selettore skin sotto il nome: due pulsanti a colore FISSO (viola/blu) */
  .skinpick{display:flex;gap:16px;justify-content:center;align-items:center;margin-bottom:14px}
  .skin-btn{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent;cursor:pointer;font-size:0;transition:transform .1s,box-shadow .15s,opacity .15s,border-color .15s}
  .skin-btn:active{transform:scale(.9)}
  .skin-btn.viola{background:#b026ff}
  .skin-btn.blu{background:#2aabee}
  .skin-btn:not(.active){opacity:.4}
  .skin-btn.active{transform:scale(1.15)}
  .skin-btn.active.viola{border-color:#fff;box-shadow:0 0 12px #b026ff}
  .skin-btn.active.blu{border-color:#fff;box-shadow:0 0 12px #2aabee}
  .arena{display:flex;justify-content:center;width:100%}
  .stage{
    /* layout a colonna: griglia (quadrata, piena larghezza) sopra, scala moltiplicatore
       ORIZZONTALE sotto. Cosi' la griglia si allarga su tutta la larghezza disponibile. */
    position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;
    width:100%;max-width:584px;
    background:var(--panel);border:1px solid #1c1030;border-radius:8px;
    padding:14px;
    box-shadow:0 0 30px rgba(176,38,255,.08) inset;
  }
  .grid-wrap{position:relative;width:100%;max-width:560px;line-height:0}
  .leaderboard{width:222px;background:var(--panel);border:1px solid #1c1030;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 30px rgba(176,38,255,.08) inset}
  .lb-head{color:var(--green);letter-spacing:3px;font-size:15px;text-align:center;text-shadow:0 0 6px var(--green-dim)}
  .lb-me{display:flex;align-items:center;gap:8px;justify-content:center}
  .lb-me .lbl{font-size:10px;letter-spacing:2px;color:#8a7a9a;text-transform:uppercase}
  .lb-me input{width:130px;background:#0a0712;border:1px solid var(--red-dim);color:var(--green);font-family:inherit;font-size:14px;padding:5px;border-radius:4px;text-align:center}
  #lbList{list-style:none;display:flex;flex-direction:column;gap:4px;margin:0;padding:0;max-height:474px;overflow:auto}
  #lbList li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;background:#0a0712;font-size:13px}
  #lbList li.me{outline:1px solid var(--green);box-shadow:0 0 8px var(--green-dim)}
  #lbList .rank{color:#8a7a9a;width:24px;text-align:center;flex:none}
  #lbList .nm{flex:1;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #lbList .sc{font-variant-numeric:tabular-nums;flex:none}
  #lbList .sc.pos{color:var(--green)}
  #lbList .sc.neg{color:var(--red-glow)}
  .stage.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translate(-2px,1px)}
    20%,80%{transform:translate(4px,-2px)}
    30%,50%,70%{transform:translate(-7px,3px)}
    40%,60%{transform:translate(7px,-3px)}
  }
  #gridSvg{display:block;width:100%;height:auto}
  /* scala moltiplicatore: barra ORIZZONTALE a piena larghezza, sotto la griglia */
  #scaleSvg{display:block;width:100%;max-width:560px;height:auto;pointer-events:none}
  .cell{fill:var(--cell-fill);stroke:var(--red);stroke-width:1.4;cursor:pointer;transition:fill .12s}
  .cell:hover{fill:var(--cell-hover)}
  .cell.armed{animation:armpulse .6s ease-in-out infinite}
  @keyframes armpulse{0%,100%{fill:var(--cell-hover)}50%{fill:var(--cell-armed)}}
  .laser{stroke-linecap:round;filter:drop-shadow(0 0 8px var(--red-glow)) drop-shadow(0 0 18px var(--red))}
  .telegraph{stroke:var(--red);stroke-width:1;opacity:.35;stroke-dasharray:4 4}
  .demoncat{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:catin .55s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 0 5px var(--red)) drop-shadow(0 0 16px var(--red-glow))}
  @keyframes catin{0%{opacity:0;transform:scale(.15) rotate(-10deg)}55%{opacity:1;transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  .demoncat .eye{animation:eyeflick 1.3s steps(1,end) infinite}
  @keyframes eyeflick{0%,40%,52%,90%,100%{opacity:1}46%{opacity:.2}48%{opacity:1}94%{opacity:.3}}
  /* faccia neon viola: alternata in modo random al gatto demoniaco al game over.
     mix-blend-mode:screen elimina lo sfondo nero del JPG, resta solo neon+glow. */
  #deathFace{position:absolute;left:50%;top:50%;width:72%;aspect-ratio:1/1;transform:translate(-50%,-50%);pointer-events:none;z-index:3;filter:drop-shadow(0 0 7px var(--red)) drop-shadow(0 0 20px var(--red-glow))}
  #deathFace[hidden]{display:none}
  #deathFace.show{animation:facein .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes facein{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-8deg)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
  .hud{margin-top:16px;width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
  .stat{background:var(--panel);border:1px solid #1a0c0c;border-radius:6px;padding:8px 14px;min-width:104px;text-align:center}
  .stat .lbl{font-size:10px;letter-spacing:2px;color:#7a6a6a;text-transform:uppercase}
  .stat .val{font-size:20px;color:var(--green);text-shadow:0 0 6px var(--green-dim);margin-top:2px;display:inline-block;transform-origin:center}
  .stat .val.red{color:var(--red);text-shadow:0 0 6px var(--red)}
  /* pop/zoom della VINCITA ad ogni schivata (riavviato via reflow in survive()) */
  .stat .val.winpop{animation:winpop .32s cubic-bezier(.2,1.4,.35,1)}
  @keyframes winpop{0%{transform:scale(1)}45%{transform:scale(1.32);text-shadow:0 0 14px var(--green)}100%{transform:scale(1)}}
  /* pulse piu' sobrio del moltiplicatore */
  .stat .val.multpop{animation:multpop .32s ease-out}
  @keyframes multpop{0%{transform:scale(1)}45%{transform:scale(1.14);text-shadow:0 0 12px var(--red-glow)}100%{transform:scale(1)}}
  .betbox input{
    width:80px;background:#0a0705;border:1px solid var(--red-dim);color:var(--green);
    font-family:inherit;font-size:16px;padding:6px;border-radius:4px;text-align:center;
  }
  button{
    font-family:inherit;font-weight:700;letter-spacing:2px;cursor:pointer;border:none;border-radius:6px;
    padding:12px 22px;font-size:15px;transition:transform .08s,box-shadow .15s,opacity .15s;
  }
  button:active{transform:scale(.96)}
  button:disabled{opacity:.35;cursor:not-allowed}
  #startBtn{background:var(--green);color:#042033;box-shadow:0 0 14px var(--green-dim)}
  #cashBtn{background:var(--red);color:#fff;box-shadow:0 0 14px var(--red)}
  #cashBtn:not(:disabled){animation:cashpulse 1.1s ease-in-out infinite}
  @keyframes cashpulse{0%,100%{box-shadow:0 0 10px var(--red)}50%{box-shadow:0 0 22px var(--red-glow)}}
  .msg{margin-top:12px;min-height:22px;font-size:14px;letter-spacing:2px;text-align:center;color:var(--green);text-shadow:0 0 6px var(--green-dim)}
  .msg.dead{color:var(--red);text-shadow:0 0 8px var(--red)}
  #lbLink{display:flex;align-items:center;justify-content:center;gap:8px;margin:28px auto 4px;width:100%;max-width:440px;box-sizing:border-box;font-family:inherit;font-weight:700;letter-spacing:3px;font-size:16px;text-decoration:none;color:var(--green);background:rgba(42,171,238,.08);border:2px solid var(--green-dim);border-radius:8px;padding:15px 22px;text-align:center;transition:transform .08s,box-shadow .15s,background .15s}
  #lbLink:active{transform:scale(.97)}
  #lbLink:hover{background:rgba(42,171,238,.16);box-shadow:0 0 16px var(--green-dim)}
  .sound-toggle{position:fixed;top:14px;right:14px;z-index:120;background:var(--panel);border:1px solid #1a0c0c;color:var(--green);padding:6px 10px;font-size:12px;letter-spacing:1px}
  #langWrap{position:fixed;top:14px;left:14px;z-index:120}
  #langBtn{background:var(--panel);border:1px solid #1a0c0c;color:var(--green);padding:6px 10px;font-size:12px;letter-spacing:1px;font-family:inherit;cursor:pointer;border-radius:4px}
  #langMenu{position:absolute;top:36px;left:0;background:var(--panel);border:1px solid #1c1030;border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
  #langMenu[hidden]{display:none}
  #langMenu button{background:none;border:none;color:var(--txt);text-align:left;padding:8px 10px;font-size:13px;letter-spacing:1px;border-radius:4px;cursor:pointer;font-family:inherit}
  #langMenu button:hover{background:#1a1030;color:var(--green)}
  #langMenu button.sel{color:var(--green);background:#15102a}
  #flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:50}
  #crtBtn{top:48px}
  #crt{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden;
    background:
      linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.22) 50%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.55) 100%);
    background-size:100% 3px,100% 100%;
    animation:crtflicker 3.2s infinite;}
  #crt::after{content:"";position:absolute;inset:0;mix-blend-mode:screen;opacity:.18;
    background:linear-gradient(90deg, rgba(255,0,40,0.5), rgba(0,255,80,0.18), rgba(40,0,255,0.5));}
  #crt::before{content:"";position:absolute;left:0;right:0;top:-32%;height:32%;
    background:linear-gradient(rgba(57,255,94,0.07),rgba(57,255,94,0));
    animation:crtscan 7s linear infinite;}
  @keyframes crtscan{0%{top:-32%}100%{top:100%}}
  @keyframes crtflicker{0%{opacity:.96}3%{opacity:1}6%{opacity:.95}9%{opacity:1}48%{opacity:.98}49%{opacity:.92}50%{opacity:1}100%{opacity:.98}}
  /* ---- MOBILE: HUD compatto a 2 colonne (la griglia e' gia' a piena larghezza) ---- */
  @media (max-width:640px){
    body{padding:8px}
    .stage{padding:10px;gap:10px}
    .hud{gap:8px;margin-top:14px}
    .stat{min-width:0;flex:1 1 calc(50% - 6px);padding:6px 8px}
    .stat .lbl{font-size:9px;letter-spacing:1px}
    .stat .val{font-size:17px}
    .betbox input{width:100%}
    #startBtn,#cashBtn{flex:1 1 calc(50% - 6px);padding:11px 8px;font-size:14px;letter-spacing:1px}
  }
</style>
</head>
<body>
  <div id="flash"></div>
  <div id="crt"></div>
  <button class="sound-toggle" id="soundBtn">♪ ON</button>
  <button class="sound-toggle" id="crtBtn">▦ CRT</button>
  <div id="langWrap"><button id="langBtn" title="Lingua / Language">🌐 IT</button><div id="langMenu" hidden></div></div>
  <header>
    <img class="logo" src="durov-neon-blue.png" width="50" height="50" alt="Survive Gram" decoding="async">
    <h1>Survive Gram</h1>
  </header>
  <div class="skinpick">
    <button class="skin-btn viola" data-skin="viola" aria-label="Viola" title="Viola"></button>
    <button class="skin-btn blu" data-skin="blu" aria-label="Blu" title="Blu"></button>
  </div>

  <div class="arena">
    <div class="stage" id="stage">
      <div class="grid-wrap">
        <svg id="gridSvg" width="560" height="560" viewBox="0 0 560 560"></svg>
        <img id="deathFace" src="durov-neon-purple.png" alt="" decoding="async" hidden>
      </div>
      <svg id="scaleSvg" viewBox="0 0 560 52" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="hud">
    <div class="stat"><div class="lbl" data-i18n="hud_balance">Saldo</div><div class="val" id="balanceVal">1000.00</div></div>
    <div class="betbox stat"><div><div class="lbl" data-i18n="hud_bet">Puntata</div><input id="betInput" type="number" value="10" min="1" step="1"></div></div>
    <div class="stat"><div class="lbl" data-i18n="hud_mult">Moltipl.</div><div class="val red" id="multVal">1.00x</div></div>
    <div class="stat"><div class="lbl" data-i18n="hud_win">Vincita</div><div class="val" id="winVal">0.00</div></div>
    <button id="startBtn">START</button>
    <button id="cashBtn" disabled>CASH OUT</button>
  </div>

  <div class="msg" id="msg">Premi START, poi clicca una cella per schivare il laser.</div>

  <a id="lbLink" href="classifica.html" data-i18n="btn_leaderboard">🏆 CLASSIFICA</a>

<script>
(function(){
  "use strict";
  const SVG_NS="http://www.w3.org/2000/svg";
  const BOARD=560;
  const START=10;        // griglia iniziale 10x10
  const EDGE=0.96;       // house edge (riproduce esattamente 1.19x..96.0x)
  const MAX_ROUNDS=18;   // da 10x10 a 1x1 riducendo 1 dimensione per round

  /* ---------- TELEGRAM MINI APP (tutto opzionale: funziona anche fuori da Telegram) ---------- */
  const TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
  function tgv(v){ try{ return !!(TG&&TG.isVersionAtLeast&&TG.isVersionAtLeast(v)); }catch(e){ return false; } }
  function haptic(kind){
    if(!TG||!TG.HapticFeedback||!tgv("6.1")) return;
    try{
      if(kind==="dodge") TG.HapticFeedback.impactOccurred("light");
      else if(kind==="death") TG.HapticFeedback.notificationOccurred("error");
      else if(kind==="cash"||kind==="max") TG.HapticFeedback.notificationOccurred("success");
    }catch(e){}
  }

  // Sagoma LED gatto demoniaco (mostrata quando il laser colpisce la tua cella)
  const CAT_SVG=`
  <path d="M250 206 Q234 176 249 160 Q258 178 264 205 Z" fill="#0c0212" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M310 206 Q326 176 311 160 Q302 178 296 205 Z" fill="#0c0212" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M280 432 C232 432 188 408 174 362 C160 318 150 276 168 226 L122 112 L240 190 L280 206 L320 190 L438 112 L392 226 C410 276 400 318 386 362 C372 408 328 432 280 432 Z" fill="#0c0212" stroke="var(--red)" stroke-width="3" stroke-linejoin="round"/>
  <line x1="176" y1="332" x2="96" y2="320" stroke="var(--red)" stroke-width="1.6" opacity="0.7"/>
  <line x1="176" y1="346" x2="92" y2="350" stroke="var(--red)" stroke-width="1.6" opacity="0.7"/>
  <line x1="178" y1="360" x2="98" y2="380" stroke="var(--red)" stroke-width="1.6" opacity="0.7"/>
  <line x1="384" y1="332" x2="464" y2="320" stroke="var(--red)" stroke-width="1.6" opacity="0.7"/>
  <line x1="384" y1="346" x2="468" y2="350" stroke="var(--red)" stroke-width="1.6" opacity="0.7"/>
  <line x1="382" y1="360" x2="462" y2="380" stroke="var(--red)" stroke-width="1.6" opacity="0.7"/>
  <line x1="190" y1="256" x2="258" y2="278" stroke="var(--red)" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="256" x2="302" y2="278" stroke="var(--red)" stroke-width="6" stroke-linecap="round"/>
  <path class="eye" d="M200 292 Q230 272 262 294 Q230 308 200 292 Z" fill="var(--red-glow)"/>
  <path class="eye" d="M360 292 Q330 272 298 294 Q330 308 360 292 Z" fill="var(--red-glow)"/>
  <ellipse cx="231" cy="293" rx="5" ry="13" fill="#0c0212"/>
  <ellipse cx="329" cy="293" rx="5" ry="13" fill="#0c0212"/>
  <path d="M272 330 L288 330 L280 343 Z" fill="var(--red)"/>
  <path d="M236 360 Q280 396 324 360" fill="none" stroke="var(--red)" stroke-width="4" stroke-linecap="round"/>
  <path d="M248 372 L260 372 L254 392 Z" fill="#0c0212" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M300 372 L312 372 L306 392 Z" fill="#0c0212" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/>
  `;

  const $=id=>document.getElementById(id);
  const gridSvg=$("gridSvg"), scaleSvg=$("scaleSvg"), stage=$("stage"), deathFace=$("deathFace");
  const balanceVal=$("balanceVal"), multVal=$("multVal"), winVal=$("winVal");
  const betInput=$("betInput"), startBtn=$("startBtn"), cashBtn=$("cashBtn"), msg=$("msg");
  const flash=$("flash"), soundBtn=$("soundBtn"), crtBtn=$("crtBtn"), crt=$("crt");
  const skinBtns=Array.from(document.querySelectorAll(".skin-btn"));
  const langBtn=$("langBtn"), langMenu=$("langMenu");
  const lbList=$("lbList"), nameInput=$("nameInput");

  let state={playing:false,busy:false,maxed:false,rows:START,cols:START,round:0,mult:1,bet:0,balance:1000,axis:"h"};
  let deathPick=0;   // (skin viola) alterna gatto/faccia al game over
  /* SKIN: "viola" (gatto/Durov viola) oppure "blu" (Durov blu, laser blu). Salvata in localStorage. */
  let theme="viola"; try{ const s=localStorage.getItem("sg_theme"); if(s==="blu"||s==="viola") theme=s; }catch(e){}
  const THEME_BG={viola:"#070310", blu:"#03070f"};

  /* ---------- AUDIO (Web Audio, nessun file) ---------- */
  let actx=null, soundOn=true;
  function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==="suspended") actx.resume(); return actx; }
  function tone(f0,f1,dur,type,vol){
    const a=audio(); if(!a||!soundOn) return;
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur);
  }
  function noise(dur,vol){
    const a=audio(); if(!a||!soundOn) return;
    const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=a.createBufferSource(), g=a.createGain(), t=a.currentTime;
    src.buffer=buf; g.gain.setValueAtTime(vol||0.35,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(g); g.connect(a.destination); src.start(t);
  }
  function evilLaugh(){
    const a=audio(); if(!a||!soundOn) return;
    const base=a.currentTime;
    // distorsione (grit) per un timbro cattivo
    const shaper=a.createWaveShaper(), curve=new Float32Array(256);
    for(let i=0;i<256;i++){const x=i/128-1; curve[i]=Math.tanh(x*3.2);}
    shaper.curve=curve; shaper.oversample="2x";
    const master=a.createGain(); master.gain.value=0.85;
    shaper.connect(master); master.connect(a.destination);
    // sillabe gravi e distanziate (più minacciose)
    const onsets=[0,0.26,0.50,0.76,1.06,1.40];
    const pitches=[118,110,102,94,84,76];
    onsets.forEach((t,i)=>{
      const st=base+t;
      [[1,0.15],[0.5,0.17],[1.012,0.11]].forEach(([mul,vol])=>{ // fondamentale + ottava sotto + detune
        const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
        f.type="lowpass"; f.frequency.value=560;
        o.type="sawtooth";
        o.frequency.setValueAtTime(pitches[i]*mul*1.1, st);
        o.frequency.exponentialRampToValueAtTime(pitches[i]*mul*0.8, st+0.2);
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(vol, st+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, st+0.24);
        o.connect(f); f.connect(g); g.connect(shaper);
        o.start(st); o.stop(st+0.28);
      });
    });
    // growl sub-bass profondo
    const o2=a.createOscillator(), g2=a.createGain();
    o2.type="sine";
    o2.frequency.setValueAtTime(52,base); o2.frequency.exponentialRampToValueAtTime(26,base+1.7);
    g2.gain.setValueAtTime(0.0001,base);
    g2.gain.exponentialRampToValueAtTime(0.24,base+0.08);
    g2.gain.exponentialRampToValueAtTime(0.0001,base+1.8);
    o2.connect(g2); g2.connect(a.destination); o2.start(base); o2.stop(base+1.85);
  }
  const sfx={
    charge:()=>tone(180,520,0.28,"sine",0.12),
    laser :()=>{tone(900,120,0.30,"sawtooth",0.20); noise(0.12,0.10);},
    safe  :()=>{tone(660,660,0.07,"sine",0.18); setTimeout(()=>tone(990,990,0.10,"sine",0.18),70);},
    boom  :()=>{noise(0.45,0.5); tone(90,40,0.5,"sine",0.4);},
    cash  :()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.16,"triangle",0.2),i*90)),
    evil  :()=>evilLaugh()
  };

  /* ---------- MATEMATICA MOLTIPLICATORI ---------- */
  // riduce 1 dimensione per round seguendo l'asse del laser; mult = EDGE * prodotto( linee/(linee-1) )
  function multAfter(k){
    if(k<=0) return 1;
    let R=START,C=START,axis="h",fp=1;
    for(let i=0;i<k;i++){
      if(axis==="h"){ fp*=R/(R-1); R--; axis="v"; }
      else          { fp*=C/(C-1); C--; axis="h"; }
    }
    return EDGE*fp;
  }
  const fmt=m=>m>=10?m.toFixed(1):m.toFixed(2);

  function el(tag,a){const e=document.createElementNS(SVG_NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
  function setBalance(v){state.balance=v;balanceVal.textContent=v.toFixed(2);}
  function setMult(){multVal.textContent=fmt(state.mult)+"x";}
  function setWin(){winVal.textContent=(state.bet*state.mult).toFixed(2);}
  /* zoom/pop della VINCITA (e pulse del moltiplicatore) ad ogni avanzamento.
     Toglie la classe, forza un reflow, la rimette: cosi' l'animazione riparte ogni round. */
  function popWin(){
    winVal.classList.remove("winpop"); multVal.classList.remove("multpop");
    void winVal.offsetWidth;                 // reflow forzato -> riavvia l'animazione
    winVal.classList.add("winpop"); multVal.classList.add("multpop");
  }

  /* messaggi localizzati: memorizza chiave+parametri per ri-tradurre al cambio lingua */
  let _mk="msg_intro", _mp={};
  function renderMsg(){
    const p=Object.assign({},_mp);
    if(p.axis!=null)   p.axis=I18N.t(p.axis==="h"?"axis_h":"axis_v");
    if(p.axisUp!=null) p.axis=I18N.t(p.axisUp==="h"?"axis_h":"axis_v").toUpperCase();
    msg.textContent=I18N.t(_mk,p);
  }
  function setMsg(key,params,dead){
    _mk=key; _mp=params||{}; renderMsg();
    if(dead) msg.classList.add("dead"); else msg.classList.remove("dead");
  }

  // Classifica: logica condivisa in lb.js (window.LB) — UI nella pagina classifica.html

  /* ---------- SCALA MOLTIPLICATORE (barra ORIZZONTALE, viewBox 560x52) ----------
     asse orizzontale: round 0..18 da sinistra a destra; moltiplicatore sopra la tacca,
     numero del round sotto; marker del livello corrente sull'asse. */
  const AX_L=46, AX_R=514, AX_Y=29;
  function drawScale(){
    scaleSvg.innerHTML="";
    const xFor=s=>AX_L+(s/MAX_ROUNDS)*(AX_R-AX_L);
    // asse orizzontale
    scaleSvg.appendChild(el("line",{x1:AX_L,y1:AX_Y,x2:AX_R,y2:AX_Y,stroke:"#3a2350","stroke-width":2,"stroke-linecap":"round"}));
    // tacche + etichette
    [2,6,10,14,18].forEach(s=>{
      const x=xFor(s);
      scaleSvg.appendChild(el("line",{x1:x,y1:AX_Y-6,x2:x,y2:AX_Y+6,stroke:"#6b5a86","stroke-width":2,"stroke-linecap":"round"}));
      const tn=el("text",{x:x,y:AX_Y+19,fill:"#6f5d88","font-size":11,"font-family":"monospace","text-anchor":"middle"});tn.textContent=s;
      scaleSvg.appendChild(tn);
      const tm=el("text",{x:x,y:AX_Y-11,fill:"#a791c4","font-size":13,"font-family":"monospace","text-anchor":"middle"});tm.textContent=fmt(multAfter(s))+"x";
      scaleSvg.appendChild(tm);
    });
    // marker del livello corrente: anello + punto pieno
    const x=xFor(state.round);
    scaleSvg.appendChild(el("circle",{cx:x,cy:AX_Y,r:6.5,fill:"none",stroke:"var(--green)","stroke-width":2,opacity:0.55}));
    scaleSvg.appendChild(el("circle",{cx:x,cy:AX_Y,r:4,fill:"var(--green)",filter:"drop-shadow(0 0 5px var(--green))"}));
  }

  /* ---------- GRIGLIA (riempie sempre il riquadro; celle = board/numero, non quadrate se righe!=colonne) ---------- */
  const GAP=6;
  let geo={cw:0,ch:0};
  function dims(R,C){ return { cw:(BOARD-GAP*(C+1))/C, ch:(BOARD-GAP*(R+1))/R }; }
  function cellXY(r,c,cw,ch){ return { x:GAP+c*(cw+GAP), y:GAP+r*(ch+GAP) }; }
  function drawGrid(){
    gridSvg.innerHTML="";
    if(deathFace){ deathFace.hidden=true; deathFace.classList.remove("show"); }   // azzera la faccia-morte
    const R=state.rows,C=state.cols;
    const {cw,ch}=dims(R,C); geo={cw,ch};
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const p=cellXY(r,c,cw,ch);
      const rect=el("rect",{x:p.x,y:p.y,width:cw,height:ch,rx:2,class:"cell"});
      rect.dataset.r=r;rect.dataset.c=c;rect.addEventListener("click",onCellClick);
      gridSvg.appendChild(rect);
    }
  }
  function center(r,c){const{cw,ch}=geo;return{x:GAP+c*(cw+GAP)+cw/2,y:GAP+r*(ch+GAP)+ch/2};}
  function bounds(){const{cw,ch}=geo;return{
    x0:GAP-8, x1:GAP+(state.cols-1)*(cw+GAP)+cw+8,
    y0:GAP-8, y1:GAP+(state.rows-1)*(ch+GAP)+ch+8 };}

  /* ---------- GIOCO ---------- */
  function onCellClick(e){
    if(!state.playing||state.busy||state.maxed) return;
    fireLaser(+e.currentTarget.dataset.r,+e.currentTarget.dataset.c,e.currentTarget);
  }

  function fireLaser(selR,selC,cellEl){
    state.busy=true;
    const axis=state.axis, lines=axis==="h"?state.rows:state.cols;
    const hitIndex=Math.floor(Math.random()*lines);
    const ctr=center(selR,selC), b=bounds();
    cellEl.classList.add("armed");
    setMsg("msg_charging",{axisUp:axis});
    sfx.charge();

    setTimeout(()=>{
      let pos;
      if(axis==="h"){ const y=center(hitIndex,0).y; pos={y}; }
      else { const x=center(0,hitIndex).x; pos={x}; }
      const sw=Math.max(4,(axis==="h"?geo.ch:geo.cw)*0.5);
      const line=el("line",axis==="h"
        ?{x1:b.x0,y1:pos.y,x2:b.x0,y2:pos.y,class:"laser",stroke:"var(--red-glow)","stroke-width":sw}
        :{x1:pos.x,y1:b.y0,x2:pos.x,y2:b.y0,class:"laser",stroke:"var(--red-glow)","stroke-width":sw});
      gridSvg.appendChild(line);
      sfx.laser();
      const dur=300,t0=performance.now();
      (function step(t){
        const k=Math.min(1,(t-t0)/dur);
        if(axis==="h") line.setAttribute("x2",(b.x0+(b.x1-b.x0)*k).toFixed(1));
        else           line.setAttribute("y2",(b.y0+(b.y1-b.y0)*k).toFixed(1));
        if(k<1) requestAnimationFrame(step); else resolve(line);
      })(t0);

      function resolve(line){
        const hit=axis==="h"?(hitIndex===selR):(hitIndex===selC);
        if(hit){ explode(ctr.x,ctr.y); deathFx(); gameOver(); }
        else{ flashSafe(ctr.x,ctr.y); sfx.safe(); setTimeout(()=>{ if(line.parentNode)line.remove(); survive(hitIndex); },240); }
      }
    },280);
  }

  function survive(cutIndex){
    haptic("dodge");
    const cutAxis=state.axis, oldR=state.rows, oldC=state.cols;
    state.round++;
    if(cutAxis==="h"){ state.rows--; state.axis="v"; }
    else             { state.cols--; state.axis="h"; }
    state.mult=multAfter(state.round); setMult(); setWin(); popWin(); drawScale();
    const finish=()=>{
      drawGrid(); state.busy=false;
      if(state.round>=MAX_ROUNDS){ state.maxed=true; setMsg("msg_max",{mult:fmt(state.mult)}); }
      else setMsg("msg_dodged",{mult:fmt(state.mult),axis:state.axis});
    };
    animateCut(cutAxis, cutIndex, oldR, oldC, state.rows, state.cols, finish);
  }
  /* la riga/colonna del laser collassa e i due lati si chiudono verso l'interno
     (le celle restanti crescono e si riposizionano per riempire di nuovo il riquadro). */
  function animateCut(axis, cut, oldR, oldC, newR, newC, done){
    const o=dims(oldR,oldC), n=dims(newR,newC);
    const items=Array.from(gridSvg.querySelectorAll(".cell")).map(rect=>{
      rect.classList.remove("armed");
      const r=+rect.dataset.r, c=+rect.dataset.c;
      const cutThis = axis==="h" ? (r===cut) : (c===cut);
      const p0=cellXY(r,c,o.cw,o.ch);
      if(cutThis) return {rect,cut:true,p0};
      const nr = axis==="h" ? (r<cut?r:r-1) : r;
      const nc = axis==="v" ? (c<cut?c:c-1) : c;
      return {rect,cut:false,p0,p1:cellXY(nr,nc,n.cw,n.ch)};
    });
    const dur=340, t0=performance.now();
    (function step(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);   // easeOutCubic
      items.forEach(a=>{
        if(a.cut){
          if(axis==="h"){ a.rect.setAttribute("height",Math.max(0,o.ch*(1-e)).toFixed(2)); a.rect.setAttribute("y",(a.p0.y+o.ch/2*e).toFixed(2)); }
          else          { a.rect.setAttribute("width", Math.max(0,o.cw*(1-e)).toFixed(2)); a.rect.setAttribute("x",(a.p0.x+o.cw/2*e).toFixed(2)); }
          a.rect.setAttribute("opacity",(1-e).toFixed(2));
        }else{
          a.rect.setAttribute("x",(a.p0.x+(a.p1.x-a.p0.x)*e).toFixed(2));
          a.rect.setAttribute("y",(a.p0.y+(a.p1.y-a.p0.y)*e).toFixed(2));
          a.rect.setAttribute("width",(o.cw+(n.cw-o.cw)*e).toFixed(2));
          a.rect.setAttribute("height",(o.ch+(n.ch-o.ch)*e).toFixed(2));
        }
      });
      if(k<1) requestAnimationFrame(step); else done();
    })(t0);
  }

  function gameOver(){
    state.playing=false;state.busy=false;
    LB.addScore(-state.bet);            // netto: perdita della puntata
    cashBtn.disabled=true;startBtn.disabled=false;
    setMsg("msg_hit",{bet:state.bet.toFixed(2)},true);
    drawScale();
  }

  function cashOut(){
    if(!state.playing||state.busy) return;
    const win=state.bet*state.mult; setBalance(state.balance+win);
    LB.addScore(win-state.bet);         // netto: profitto (puntata gia' rientrata)
    state.playing=false;state.maxed=false;cashBtn.disabled=true;startBtn.disabled=false;
    haptic("cash"); sfx.cash();
    setMsg("msg_cashed",{win:win.toFixed(2),mult:fmt(state.mult)});
  }

  function start(){
    audio();
    const bet=parseFloat(betInput.value);
    if(!(bet>0)){setMsg("err_bet");return;}
    if(bet>state.balance){setMsg("err_balance");return;}
    setBalance(state.balance-bet);
    Object.assign(state,{playing:true,busy:false,maxed:false,rows:START,cols:START,round:0,mult:1,bet,axis:"h"});
    setMult();setWin();drawGrid();drawScale();
    startBtn.disabled=true;cashBtn.disabled=false;
    setMsg("msg_pick",{axis:"h"});
  }

  /* ---------- EFFETTI ---------- */
  function explode(x,y){
    for(let i=0;i<3;i++){
      const c=el("circle",{cx:x,cy:y,r:4,fill:"none",stroke:"var(--red-glow)","stroke-width":3});
      gridSvg.appendChild(c);
      const t0=performance.now()-i*60,dur=600+i*120,maxR=150;
      (function s(t){const k=Math.min(1,(t-t0)/dur);c.setAttribute("r",(4+maxR*k).toFixed(1));c.setAttribute("opacity",(1-k).toFixed(2));if(k<1)requestAnimationFrame(s);else c.remove();})(performance.now());
    }
  }
  function deathFx(){
    haptic("death");
    sfx.boom();
    setTimeout(()=>sfx.evil(),140);
    stage.classList.add("shake"); setTimeout(()=>stage.classList.remove("shake"),460);
    flash.style.transition="none"; flash.style.opacity="0.6";
    requestAnimationFrame(()=>{ flash.style.transition="opacity .5s"; flash.style.opacity="0"; });
    // skin BLU -> sempre Durov blu; skin VIOLA -> alterna gatto demoniaco / Durov viola
    const art=(theme==="blu") ? showDemonFace : ((deathPick++ % 2===0)?showDemonCat:showDemonFace);
    setTimeout(art,170);
  }
  function showDemonCat(){
    const g=document.createElementNS(SVG_NS,"g");
    g.setAttribute("class","demoncat");
    g.innerHTML=CAT_SVG;
    gridSvg.appendChild(g);
  }
  function showDemonFace(){
    deathFace.src=(theme==="blu") ? "durov-neon-blue-lg.png" : "durov-neon-purple.png";
    deathFace.hidden=false;
    deathFace.classList.remove("show"); void deathFace.offsetWidth;   // reflow -> riavvia l'entrata
    deathFace.classList.add("show");
  }
  function flashSafe(x,y){
    const c=el("circle",{cx:x,cy:y,r:6,fill:"none",stroke:"var(--green)","stroke-width":3});
    gridSvg.appendChild(c);
    const t0=performance.now(),dur=300;
    (function s(t){const k=Math.min(1,(t-t0)/dur);c.setAttribute("r",(6+40*k).toFixed(1));c.setAttribute("opacity",(1-k).toFixed(2));if(k<1)requestAnimationFrame(s);else c.remove();})(t0);
  }

  /* ---------- INPUT ---------- */
  startBtn.addEventListener("click",start);
  cashBtn.addEventListener("click",cashOut);
  soundBtn.addEventListener("click",()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?"♪ ON":"♪ OFF";});
  let crtOn=true;
  crtBtn.addEventListener("click",()=>{crtOn=!crtOn;crt.style.display=crtOn?"block":"none";crtBtn.textContent=crtOn?"▦ CRT":"▦ OFF";});
  // toggle skin VIOLA <-> BLU
  function applyTheme(t){
    theme=t;
    document.body.classList.toggle("theme-blue", t==="blu");
    skinBtns.forEach(b=>b.classList.toggle("active", b.dataset.skin===t));
    deathFace.src = (t==="blu") ? "durov-neon-blue-lg.png" : "durov-neon-purple.png";   // precarica l'immagine giusta
    try{ localStorage.setItem("sg_theme", t); }catch(e){}
    const bg=THEME_BG[t]||THEME_BG.viola;
    const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",bg);
    try{ if(TG&&tgv("6.1")){ TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } }catch(e){}
  }
  skinBtns.forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.skin)));
  // selettore lingua
  function langLabel(){ return "🌐 "+I18N.cur.toUpperCase(); }
  function buildLangMenu(){
    langMenu.innerHTML="";
    I18N.LANGS.forEach(code=>{
      const b=document.createElement("button");
      b.textContent=I18N.FLAGS[code]+" "+I18N.NAMES[code];
      if(code===I18N.cur) b.className="sel";
      b.addEventListener("click",ev=>{ ev.stopPropagation(); I18N.set(code); langMenu.hidden=true; });
      langMenu.appendChild(b);
    });
  }
  langBtn.addEventListener("click",ev=>{ ev.stopPropagation(); langMenu.hidden=!langMenu.hidden; });
  langMenu.addEventListener("click",ev=>ev.stopPropagation());
  document.addEventListener("click",()=>{ langMenu.hidden=true; });
  window.addEventListener("i18n:change",()=>{ langBtn.textContent=langLabel(); buildLangMenu(); renderMsg(); });
  document.addEventListener("keydown",e=>{
    if(e.target&&e.target.tagName==="INPUT") return;   // non interferire mentre si scrive nome/puntata
    if(e.code==="Space"||e.code==="Enter"){
      e.preventDefault();
      if(!state.playing) start(); else if(!state.busy) cashOut();
    }
  });
  LB.load();
  if(TG){
    try{ TG.ready(); TG.expand(); }catch(e){}
    try{ if(tgv("7.7")&&TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }catch(e){}
  }
  LB.cloudLoad();
  I18N.apply(document); langBtn.textContent=langLabel(); buildLangMenu(); setMsg("msg_intro");
  applyTheme(theme);
  setBalance(1000);drawGrid();drawScale();
})();
</script>
</body>
